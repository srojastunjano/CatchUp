services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catchup
      POSTGRES_PASSWORD: catchup
      POSTGRES_DB: catchup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catchup"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata:
